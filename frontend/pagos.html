<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Pagos diarios · AUTO-CONTROL</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
  <script type="module" src="/js/pages/pagos.js"></script>
</head>
<body>
  <main id="page" x-data="page" x-cloak>

    <!-- Encabezado + mes -->
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <h1 class="page-title">Pagos diarios</h1>
        <p class="page-sub">Toca un vehículo para abrir su calendario.</p>
      </div>
      <div class="flex items-center gap-1 rounded-xl border border-slate-200 bg-white p-1">
        <button type="button" class="icon-btn size-9" @click="go(-1)" aria-label="Mes anterior" x-html="icons.left"></button>
        <span class="min-w-36 text-center text-sm font-semibold" x-text="fmt.monthLabel(month)"></span>
        <button type="button" class="icon-btn size-9" @click="go(1)" aria-label="Mes siguiente" x-html="icons.right"></button>
      </div>
    </div>

    <!-- Resumen del mes -->
    <section class="card mt-4 overflow-hidden" x-show="data">
      <div class="grid grid-cols-3 divide-x divide-slate-100 text-center">
        <div class="px-2 py-3"><p class="text-[11px] font-medium text-slate-500">Ingresos</p>
          <p class="text-base font-bold text-emerald-600 lg:text-xl" x-text="fmt.money(data?.totals.income)"></p></div>
        <div class="px-2 py-3"><p class="text-[11px] font-medium text-slate-500">Gastos</p>
          <p class="text-base font-bold text-rose-600 lg:text-xl" x-text="fmt.money(data?.totals.expenses)"></p></div>
        <div class="px-2 py-3"><p class="text-[11px] font-medium text-slate-500">Total</p>
          <p class="text-base font-bold lg:text-xl" :class="Number(data?.totals.net) < 0 ? 'text-rose-600' : 'text-slate-900'" x-text="fmt.money(data?.totals.net)"></p></div>
      </div>
      <div class="flex items-center justify-between gap-2 border-t border-slate-100 bg-amber-50 px-4 py-2 text-sm text-amber-800" x-show="data?.totals.pendingDays">
        <span x-text="`Faltan marcar ${data?.totals.pendingDays} día${data?.totals.pendingDays === 1 ? '' : 's'} en ${fmt.monthLabel(month).toLowerCase()}`"></span>
      </div>
    </section>

    <!-- Cargando -->
    <div class="mt-4 grid gap-3 lg:grid-cols-2 xl:grid-cols-3" x-show="loading && !data">
      <template x-for="i in 4"><div class="card h-28 animate-pulse bg-slate-200/50"></div></template>
    </div>

    <!-- Sin vehículos -->
    <div class="card mt-4 flex flex-col items-center px-6 py-12 text-center" x-show="data && !items.length">
      <span class="flex size-14 items-center justify-center rounded-2xl bg-brand-50 text-brand-600" x-html="icons.car"></span>
      <p class="mt-4 font-semibold">Aún no hay vehículos</p>
      <p class="mt-1 max-w-xs text-sm text-slate-500">Registra un vehículo e inicia su alquiler para empezar a marcar los cobros.</p>
      <a href="/vehiculos.html" class="btn btn-primary mt-5">Ir a Vehículos</a>
    </div>

    <!-- Vehículos -->
    <section class="mt-4 grid gap-3 lg:grid-cols-2 xl:grid-cols-3" :class="loading && 'opacity-60'">
      <template x-for="v in items" :key="v.id">
        <a :href="calendarUrl(v)" class="card block p-4 transition hover:border-brand-200 active:scale-[.99]">
          <div class="flex items-start gap-3">
            <span class="inline-flex shrink-0 flex-col items-center rounded-md border-2 border-slate-800 bg-white px-1.5 pt-0.5 pb-1 leading-none">
              <span class="text-[7px] font-bold tracking-[.2em] text-slate-500">PERÚ</span>
              <span class="font-mono text-[15px] font-bold tracking-wider" x-text="fmt.plate(v.plate)"></span>
            </span>
            <div class="min-w-0 flex-1">
              <p class="truncate font-semibold" x-text="`${v.brand} ${v.model}`"></p>
              <p class="truncate text-xs text-slate-500" x-text="v.activeRental ? `${v.activeRental.renter.fullName} · ${fmt.money(v.activeRental.dailyRate)}/día` : 'Sin alquiler activo'"></p>
            </div>
            <div class="text-right">
              <p class="text-[11px] text-slate-500">Ingresos</p>
              <p class="font-bold text-emerald-600" x-text="fmt.money(v.summary.income)"></p>
            </div>
          </div>
          <div class="mt-3 flex items-center gap-3 border-t border-slate-100 pt-3 text-xs">
            <template x-for="(st, key) in DAY_STATUS" :key="key">
              <span class="flex items-center gap-1 text-slate-600" :title="st.legend">
                <span class="size-2.5 rounded-full" :class="st.dot"></span><span x-text="v.summary.counts[key]"></span>
              </span>
            </template>
            <span class="ml-auto pill" :class="v.summary.pendingDays ? 'bg-amber-50 text-amber-700' : 'bg-slate-100 text-slate-500'"
              x-text="v.summary.pendingDays ? `${v.summary.pendingDays} por marcar` : `Gastos ${fmt.money(v.summary.expenses)}`"></span>
          </div>
        </a>
      </template>
    </section>

  </main>
</body>
</html>
