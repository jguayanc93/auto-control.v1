<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Documentos · AUTO-CONTROL</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
  <script type="module" src="/js/pages/documentos.js"></script>
</head>
<body>
  <main id="page" x-data="page" x-cloak>

    <!-- Encabezado -->
    <div class="flex items-end justify-between gap-3">
      <div>
        <h1 class="page-title">Documentos</h1>
        <p class="page-sub">SOAT, revisión técnica y demás papeles de tu flota.</p>
      </div>
      <button type="button" class="btn btn-primary hidden lg:inline-flex" @click="openUpload"><span x-html="icons.plus"></span>Subir documento</button>
    </div>

    <!-- Alerta -->
    <button type="button" class="mt-4 flex w-full items-center gap-3 rounded-2xl border px-4 py-3 text-left text-sm"
      x-show="attention.expired || attention.expiring" @click="filter = attention.expired ? 'vencido' : 'por_vencer'"
      :class="attention.expired ? 'border-rose-200 bg-rose-50 text-rose-800' : 'border-amber-200 bg-amber-50 text-amber-800'">
      <span x-html="icons.alert"></span>
      <span class="flex-1">
        <b x-show="attention.expired" x-text="`${attention.expired} vencido${attention.expired === 1 ? '' : 's'}`"></b>
        <span x-show="attention.expired && attention.expiring"> · </span>
        <b x-show="attention.expiring" x-text="`${attention.expiring} por vencer (30 días)`"></b>
      </span>
      <span class="text-xs font-semibold underline">Ver</span>
    </button>

    <!-- Filtros -->
    <div class="mt-3 space-y-2" x-show="items.length">
      <div class="flex flex-col gap-2 lg:flex-row">
        <div class="relative lg:max-w-xs lg:flex-1">
          <span class="pointer-events-none absolute inset-y-0 left-3.5 flex items-center text-slate-400" x-html="icons.search"></span>
          <input type="search" x-model="q" placeholder="Buscar placa, tipo o número…" class="input pl-10" aria-label="Buscar documento">
        </div>
        <select class="input lg:max-w-xs" x-model="vehicleFilter" aria-label="Filtrar por vehículo">
          <option value="">Todos los vehículos</option>
          <template x-for="v in vehicles" :key="v.id"><option :value="v.id" x-text="`${fmt.plate(v.plate)} · ${v.brand} ${v.model}`"></option></template>
        </select>
      </div>
      <div class="-mx-4 flex gap-2 overflow-x-auto px-4 pb-1 lg:mx-0 lg:px-0">
        <template x-for="f in FILTERS" :key="f[0]">
          <button type="button" @click="filter = f[0]" class="shrink-0 rounded-full border px-3 py-1.5 text-sm font-medium transition"
            :class="filter === f[0] ? 'border-navy-900 bg-navy-900 text-white' : 'border-slate-300 bg-white text-slate-600'">
            <span x-text="f[1]"></span> <span class="opacity-60" x-text="count(f[0])"></span></button>
        </template>
      </div>
    </div>

    <!-- Cargando -->
    <div class="mt-4 grid gap-3 lg:grid-cols-2 xl:grid-cols-3" x-show="loading">
      <template x-for="i in 4"><div class="card h-24 animate-pulse bg-slate-200/50"></div></template>
    </div>

    <!-- Vacío -->
    <div class="card mt-4 flex flex-col items-center px-6 py-12 text-center" x-show="!loading && !items.length">
      <span class="flex size-14 items-center justify-center rounded-2xl bg-brand-50 text-brand-600" x-html="icons.file"></span>
      <p class="mt-4 font-semibold">Aún no hay documentos</p>
      <p class="mt-1 max-w-xs text-sm text-slate-500">Toma una foto del SOAT o la revisión técnica y te avisaremos 30 días antes de que venza.</p>
      <button type="button" class="btn btn-primary mt-5" @click="openUpload"><span x-html="icons.plus"></span>Subir documento</button>
    </div>
    <p class="mt-6 text-center text-sm text-slate-500" x-show="!loading && items.length && !filtered.length">No hay documentos que coincidan.</p>

    <!-- Lista -->
    <section class="mt-4 grid gap-3 lg:grid-cols-2 xl:grid-cols-3">
      <template x-for="d in filtered" :key="d.id">
        <button type="button" @click="openDetail(d)" class="card flex items-center gap-3 p-4 text-left transition hover:border-brand-200 active:scale-[.99]">
          <span class="flex size-11 shrink-0 items-center justify-center rounded-xl" :class="DOC_STATUS[d.status].tone" x-html="icons.fileSm"></span>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2">
              <p class="truncate font-semibold" x-text="DOC_TYPE[d.type]"></p>
              <span class="pill shrink-0 bg-slate-100 font-mono text-slate-700" x-text="fmt.plate(d.vehicle.plate)"></span>
            </div>
            <p class="truncate text-xs text-slate-500" x-text="d.expiresOn ? `${fmt.expiryText(d.daysToExpire)} · ${fmt.date(d.expiresOn)}` : 'Sin fecha de vencimiento'"></p>
          </div>
          <span class="pill shrink-0" :class="DOC_STATUS[d.status].tone" x-text="DOC_STATUS[d.status].label"></span>
        </button>
      </template>
    </section>

    <!-- Botón flotante (celular) -->
    <button type="button" @click="openUpload" aria-label="Subir documento"
      class="fixed right-4 bottom-[calc(5.5rem+env(safe-area-inset-bottom))] z-30 flex size-14 items-center justify-center rounded-2xl bg-brand-600 text-white shadow-lg shadow-brand-600/30 active:scale-95 lg:hidden"
      x-html="icons.plus"></button>

    <!-- ══════════════════ PANEL: DETALLE ══════════════════ -->
    <div class="sheet-wrap" x-show="sheet === 'detail'" x-cloak @keydown.escape.window="sheet === 'detail' && (sheet = null)">
      <div class="sheet-backdrop" x-show="sheet === 'detail'" x-transition.opacity @click="sheet = null"></div>
      <div class="sheet" x-show="sheet === 'detail'" role="dialog" aria-modal="true"
        x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="translate-y-full lg:translate-y-4 lg:opacity-0"
        x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="translate-y-full lg:translate-y-4 lg:opacity-0">
        <template x-if="current">
          <div class="flex min-h-0 flex-col">
            <div class="sheet-header">
              <div class="min-w-0 flex-1">
                <p class="truncate text-lg font-semibold" x-text="`${DOC_TYPE[current.type]} · ${fmt.plate(current.vehicle.plate)}`"></p>
                <span class="pill" :class="DOC_STATUS[current.status].tone" x-text="DOC_STATUS[current.status].label"></span>
              </div>
              <button type="button" class="icon-btn" @click="sheet = null" aria-label="Cerrar" x-html="icons.x"></button>
            </div>
            <div class="sheet-body space-y-4">
              <!-- Vista previa -->
              <template x-if="isImage(current)">
                <a :href="fileUrl(current)" target="_blank" rel="noopener" class="block overflow-hidden rounded-2xl border border-slate-200 bg-slate-50">
                  <img :src="fileUrl(current)" :alt="DOC_TYPE[current.type]" class="max-h-80 w-full object-contain" loading="lazy">
                </a>
              </template>
              <template x-if="!isImage(current)">
                <a :href="fileUrl(current)" target="_blank" rel="noopener" class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4">
                  <span class="flex size-12 items-center justify-center rounded-xl bg-rose-100 text-xs font-bold text-rose-700">PDF</span>
                  <div class="min-w-0 flex-1"><p class="truncate font-medium" x-text="current.fileName"></p>
                    <p class="text-xs text-slate-500" x-text="fmt.fileSize(current.sizeBytes)"></p></div>
                  <span class="text-sm font-semibold text-brand-600">Abrir</span>
                </a>
              </template>
              <div class="grid grid-cols-2 gap-2">
                <a :href="fileUrl(current)" target="_blank" rel="noopener" class="btn btn-secondary"><span x-html="icons.eye"></span>Ver</a>
                <a :href="fileUrl(current, true)" class="btn btn-secondary"><span x-html="icons.download"></span>Descargar</a>
              </div>

              <dl class="divide-y divide-slate-100 rounded-2xl border border-slate-200 text-sm">
                <div class="flex justify-between gap-4 px-4 py-2.5"><dt class="text-slate-500">Vehículo</dt><dd class="text-right font-medium" x-text="`${fmt.plate(current.vehicle.plate)} · ${current.vehicle.brand} ${current.vehicle.model}`"></dd></div>
                <div class="flex justify-between gap-4 px-4 py-2.5" x-show="current.number"><dt class="text-slate-500">Número</dt><dd class="font-medium" x-text="current.number || '—'"></dd></div>
                <div class="flex justify-between gap-4 px-4 py-2.5"><dt class="text-slate-500">Emisión</dt><dd class="font-medium" x-text="fmt.date(current.issuedOn)"></dd></div>
                <div class="flex justify-between gap-4 px-4 py-2.5"><dt class="text-slate-500">Vencimiento</dt>
                  <dd class="text-right font-medium" :class="DOC_STATUS[current.status].cls" x-text="current.expiresOn ? `${fmt.date(current.expiresOn)} (${fmt.expiryText(current.daysToExpire).toLowerCase()})` : '—'"></dd></div>
                <div class="flex justify-between gap-4 px-4 py-2.5"><dt class="text-slate-500">Subido por</dt><dd class="text-right font-medium" x-text="`${current.createdBy ?? '—'} · ${fmt.date(current.createdAt)}`"></dd></div>
                <div class="px-4 py-2.5" x-show="current.notes"><dt class="text-slate-500">Observaciones</dt><dd class="mt-0.5 whitespace-pre-line" x-text="current.notes"></dd></div>
              </dl>
            </div>
            <div class="sheet-footer" x-show="can('records:edit')">
              <button type="button" class="btn btn-secondary flex-1" @click="openEdit"><span x-html="icons.edit"></span>Editar datos</button>
              <button type="button" class="btn btn-danger" @click="remove" aria-label="Eliminar documento"><span x-html="icons.trash"></span></button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ══════════════════ PANEL: SUBIR / EDITAR ══════════════════ -->
    <div class="sheet-wrap" x-show="sheet === 'upload' || sheet === 'edit'" x-cloak
      @keydown.escape.window="(sheet === 'upload' || sheet === 'edit') && (sheet = sheet === 'edit' ? 'detail' : null)">
      <div class="sheet-backdrop" x-show="sheet === 'upload' || sheet === 'edit'" x-transition.opacity @click="sheet = sheet === 'edit' ? 'detail' : null"></div>
      <form class="sheet" x-show="sheet === 'upload' || sheet === 'edit'" @submit.prevent="sheet === 'upload' ? upload() : saveEdit()" novalidate role="dialog" aria-modal="true"
        x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="translate-y-full lg:translate-y-4 lg:opacity-0"
        x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="translate-y-full lg:translate-y-4 lg:opacity-0">
        <div class="sheet-header">
          <p class="flex-1 text-lg font-semibold" x-text="sheet === 'upload' ? 'Subir documento' : 'Editar documento'"></p>
          <button type="button" class="icon-btn" @click="sheet = sheet === 'edit' ? 'detail' : null" aria-label="Cerrar" x-html="icons.x"></button>
        </div>

        <div class="sheet-body space-y-4">
          <!-- Archivo (solo al subir) -->
          <div x-show="sheet === 'upload'">
            <template x-if="!file">
              <div>
                <div class="grid grid-cols-2 gap-2">
                  <label class="flex cursor-pointer flex-col items-center gap-1.5 rounded-2xl border-2 border-dashed border-slate-300 px-3 py-5 text-sm font-semibold text-slate-700 active:bg-slate-50"
                    :class="fields.file && 'border-rose-300'">
                    <span class="text-brand-600" x-html="icons.camera"></span>Tomar foto
                    <input type="file" accept="image/*" capture="environment" class="sr-only" @change="pickFile">
                  </label>
                  <label class="flex cursor-pointer flex-col items-center gap-1.5 rounded-2xl border-2 border-dashed border-slate-300 px-3 py-5 text-sm font-semibold text-slate-700 active:bg-slate-50"
                    :class="fields.file && 'border-rose-300'">
                    <span class="text-brand-600" x-html="icons.upload"></span>Elegir archivo
                    <input type="file" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" class="sr-only" @change="pickFile">
                  </label>
                </div>
                <p class="mt-1.5 text-xs text-slate-500" x-show="!preparing && !fields.file">PDF, JPG o PNG · máximo 5 MB. Las fotos se reducen automáticamente.</p>
                <p class="mt-1.5 text-xs text-brand-600" x-show="preparing">Preparando la imagen…</p>
              </div>
            </template>
            <template x-if="file">
              <div class="flex items-center gap-3 rounded-2xl border border-slate-200 p-2.5">
                <template x-if="preview"><img :src="preview" alt="Vista previa" class="size-16 rounded-xl object-cover"></template>
                <template x-if="!preview"><span class="flex size-16 items-center justify-center rounded-xl bg-rose-100 text-sm font-bold text-rose-700">PDF</span></template>
                <div class="min-w-0 flex-1"><p class="truncate text-sm font-medium" x-text="file.name"></p>
                  <p class="text-xs text-slate-500" x-text="fmt.fileSize(file.size)"></p></div>
                <button type="button" class="icon-btn" @click="clearFile" aria-label="Quitar archivo" x-html="icons.x"></button>
              </div>
            </template>
            <p class="field-error" x-show="fields.file" x-text="fields.file"></p>
          </div>

          <div x-show="sheet === 'upload'">
            <label class="label" for="d-vehicle">Vehículo</label>
            <select id="d-vehicle" class="input" x-model="form.vehicleId" :class="fields.vehicleId && 'input-error'">
              <option value="">Selecciona…</option>
              <template x-for="v in vehicles" :key="v.id"><option :value="v.id" x-text="`${fmt.plate(v.plate)} · ${v.brand} ${v.model}`"></option></template>
            </select>
            <p class="field-error" x-show="fields.vehicleId" x-text="fields.vehicleId"></p>
          </div>

          <div>
            <p class="label">Tipo de documento</p>
            <div class="grid grid-cols-2 gap-2">
              <template x-for="(label, key) in DOC_TYPE" :key="key">
                <button type="button" class="rounded-xl border px-3 py-2 text-sm leading-tight font-medium transition"
                  :class="form.type === key ? 'border-navy-900 bg-navy-900 text-white' : 'border-slate-300 text-slate-700'"
                  @click="form.type = key" x-text="label"></button>
              </template>
            </div>
            <p class="field-error" x-show="fields.type" x-text="fields.type"></p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="label" for="d-issued">Emisión</label>
              <input id="d-issued" class="input" type="date" x-model="form.issuedOn" :class="fields.issuedOn && 'input-error'">
              <p class="field-error" x-show="fields.issuedOn" x-text="fields.issuedOn"></p>
            </div>
            <div>
              <label class="label" for="d-expires">Vencimiento</label>
              <input id="d-expires" class="input" type="date" x-model="form.expiresOn" :class="fields.expiresOn && 'input-error'">
              <p class="field-error" x-show="fields.expiresOn" x-text="fields.expiresOn"></p>
            </div>
          </div>
          <p class="-mt-2 text-xs text-slate-500">Con fecha de vencimiento te avisaremos 30 días antes.</p>

          <div>
            <label class="label" for="d-notes">Observaciones <span class="font-normal text-slate-400">(opcional)</span></label>
            <textarea id="d-notes" class="input h-auto min-h-16 py-2.5" rows="2" x-model="form.notes" maxlength="1000"
              placeholder="Ej.: copia simple, falta el original, en trámite…"></textarea>
          </div>
        </div>

        <div class="sheet-footer">
          <button type="button" class="btn btn-secondary flex-1" @click="sheet = sheet === 'edit' ? 'detail' : null">Cancelar</button>
          <button class="btn btn-primary flex-1" :disabled="saving || preparing" x-text="saving ? 'Guardando…' : (sheet === 'upload' ? 'Guardar documento' : 'Guardar')"></button>
        </div>
      </form>
    </div>

  </main>
</body>
</html>
