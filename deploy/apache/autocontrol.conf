# AUTO-CONTROL 2.0 · VirtualHost de Apache (solo HTTP).
# certbot --apache crea la versión HTTPS (autocontrol-le-ssl.conf) a partir de este archivo
# y agrega la redirección de http → https.
#
# Antes de usarlo reemplaza:
#   proyecto.TU-DOMINIO   → tu subdominio real
#   3100                  → el PORT de backend/.env (si lo cambias)
#   /var/www/autocontrol  → la carpeta donde clonaste el repositorio
#
# Módulos necesarios: proxy proxy_http headers  (sudo a2enmod proxy proxy_http headers)

<VirtualHost *:80>
    ServerName proyecto.TU-DOMINIO

    # Solo la carpeta frontend es pública: backend/, .env y .git quedan fuera.
    DocumentRoot /var/www/autocontrol/frontend
    <Directory /var/www/autocontrol/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # ── API → Node.js (PM2), solo escucha en 127.0.0.1 ──
    ProxyPreserveHost On
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass        /api/ http://127.0.0.1:3100/api/
    ProxyPassReverse /api/ http://127.0.0.1:3100/api/

    # ── Caché ──
    # Los archivos no tienen hash en el nombre: el navegador siempre revalida (ETag),
    # así cada actualización se ve de inmediato.
    <FilesMatch "\.(html|js|css|webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(svg|png|ico)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>
    AddType application/manifest+json .webmanifest

    # ── Seguridad ──
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    ServerSignature Off

    ErrorLog ${APACHE_LOG_DIR}/autocontrol-error.log
    CustomLog ${APACHE_LOG_DIR}/autocontrol-access.log combined
</VirtualHost>
